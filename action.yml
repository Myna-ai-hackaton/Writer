name: 'Writer Agent'
description: 'AI-powered Git Project Manager that summarizes PRs and saves them to Firebase'
author: 'Myna AI'

inputs:
  openai_api_key:
    description: 'OpenAI API Key (ChatGPT)'
    required: false
  openrouter_api_key:
    description: 'OpenRouter API Key'
    required: false
  gemini_api_key:
    description: 'Google AI Studio (Gemini) API Key'
    required: false
  gh_pat:
    description: 'GitHub Personal Access Token'
    required: true
  firebase_service_account_json:
    description: 'The full JSON content of the Firebase Service Account key'
    required: true

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    OPENAI_API_KEY: ${{ inputs.openai_api_key }}
    OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
    GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
    GH_PAT: ${{ inputs.gh_pat }}
    FIREBASE_SERVICE_ACCOUNT_JSON: ${{ inputs.firebase_service_account_json }}
    FIREBASE_SERVICE_ACCOUNT_PATH: 'firebase-key.json'
