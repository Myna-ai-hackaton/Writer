name: 'Writer Agent'
description: 'AI-powered Git Project Manager that summarizes PRs and saves them to Firebase'
author: 'Myna AI'

inputs:
  openrouter_api_key:
    description: 'OpenRouter API Key'
    required: true
  gh_pat:
    description: 'GitHub Personal Access Token'
    required: true
  firebase_service_account_json:
    description: 'The full JSON content of the Firebase Service Account key (Optional if B64 is provided)'
    required: false
  firebase_service_account_b64:
    description: 'The Base64 encoded JSON content of the Firebase Service Account key (Recommended)'
    required: false

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    OPENROUTER_API_KEY: ${{ inputs.openrouter_api_key }}
    GH_PAT: ${{ inputs.gh_pat }}
    FIREBASE_SERVICE_ACCOUNT_JSON: ${{ inputs.firebase_service_account_json }}
    FIREBASE_SERVICE_ACCOUNT_B64: ${{ inputs.firebase_service_account_b64 }}
    FIREBASE_SERVICE_ACCOUNT_PATH: 'firebase-key.json'
